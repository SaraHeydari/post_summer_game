<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Test — Map & Pin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; height: 100dvh; background: #0D1B2A; color: #F0EAD6; font-family: sans-serif; overflow: hidden; }

.topbar {
  background: #162436; border-bottom: 1px solid #1E3552;
  padding: 0.6rem 1rem; display: flex; align-items: center;
  justify-content: space-between; flex-shrink: 0;
  font-size: 0.85rem;
}
.topbar h1 { color: #E8A838; font-size: 1rem; }
#status { color: #B8B09A; }
#status.ok   { color: #4CAF7D; }
#status.fail { color: #E05C3A; }

.map-wrap { position: relative; flex: 1; min-height: 0; }
#map { position: absolute; inset: 0; }

.bottombar {
  background: #162436; border-top: 1px solid #1E3552;
  padding: 0.75rem 1rem; font-size: 0.82rem; color: #B8B09A;
  flex-shrink: 0;
}
#coords { color: #E8A838; font-family: monospace; }

.layout { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
</style>
</head>
<body>
<div class="layout">
  <div class="topbar">
    <h1>Test: Map & Pin</h1>
    <span id="status">Loading map...</span>
  </div>

  <div class="map-wrap">
    <div id="map"></div>
  </div>

  <div class="bottombar">
    Tap or click anywhere on the map to place a pin.<br>
    Pin coords: <span id="coords">—</span>
  </div>
</div>

<script>
const statusEl = document.getElementById('status');
const coordsEl = document.getElementById('coords');
let pin = null;

try {
  const map = L.map('map', {
    zoomControl: true,
    tap: true,
    tapTolerance: 15,
  }).setView([30, 10], 2);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);

  // Force re-render after layout settles
  requestAnimationFrame(() => requestAnimationFrame(() => {
    map.invalidateSize();
    statusEl.textContent = '✓ Map loaded — tap to place pin';
    statusEl.className = 'ok';
  }));
  setTimeout(() => map.invalidateSize(), 400);

  map.on('click', e => {
    const { lat, lng } = e.latlng;
    if (pin) map.removeLayer(pin);

    pin = L.marker([lat, lng], {
      icon: L.divIcon({
        html: `<div style="
          width: 32px; height: 32px; border-radius: 50%;
          background: #E8A838; border: 3px solid white;
          box-shadow: 0 2px 8px rgba(0,0,0,0.5);
          display: flex; align-items: center; justify-content: center;
          font-weight: 700; font-size: 12px; color: #0D1B2A;
        ">📍</div>`,
        className: '', iconAnchor: [16, 16],
      }),
    }).addTo(map);

    coordsEl.textContent = `lat: ${lat.toFixed(4)}, lng: ${lng.toFixed(4)}`;
    statusEl.textContent = '✓ Pin placed!';
    statusEl.className = 'ok';
  });

} catch(e) {
  statusEl.textContent = '✗ Map failed: ' + e.message;
  statusEl.className = 'fail';
}
</script>
</body>
</html>
