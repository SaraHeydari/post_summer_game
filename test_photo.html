<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test — Photo Display</title>
<style>
body { background: #0D1B2A; color: #F0EAD6; font-family: sans-serif; padding: 2rem; }
h1 { color: #E8A838; margin-bottom: 1rem; }
#info { margin: 1rem 0; font-size: 0.9rem; line-height: 1.8; }
#info span { color: #E8A838; font-family: monospace; }
#photo-wrap {
  width: 100%; max-width: 800px; height: 450px;
  background: #1E3552; border: 2px dashed #1E3552;
  display: flex; align-items: center; justify-content: center;
  margin-top: 1rem; overflow: hidden;
}
#photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: none; }
#placeholder { color: #B8B09A; font-size: 0.9rem; }
label {
  display: inline-block; background: #E8A838; color: #0D1B2A;
  padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer;
  font-weight: 700; font-size: 0.9rem;
}
input[type=file] { display: none; }
.ok   { color: #4CAF7D; }
.fail { color: #E05C3A; }
</style>
</head>
<body>
<h1>Test: Photo Display</h1>
<p style="color:#B8B09A;margin-bottom:1rem">Pick a photo — same type you'll use in the game. This checks if base64 images render correctly in this browser.</p>

<label>📂 Pick a photo <input type="file" id="file-input" accept="image/*"></label>

<div id="info">Waiting for photo...</div>

<div id="photo-wrap">
  <img id="photo-img" alt="test photo">
  <div id="placeholder">Photo will appear here</div>
</div>

<script>
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;

  const info = document.getElementById('info');
  info.innerHTML = `File: <span>${file.name}</span><br>Type: <span>${file.type}</span><br>Size: <span>${(file.size / 1024).toFixed(1)} KB</span><br>Reading...`;

  const reader = new FileReader();
  reader.onload = ev => {
    const dataUrl = ev.target.result;
    const b64Len = dataUrl.length;
    const prefix = dataUrl.substring(0, 40);

    info.innerHTML = `
      File: <span>${file.name}</span><br>
      Type: <span>${file.type}</span><br>
      Size on disk: <span>${(file.size / 1024).toFixed(1)} KB</span><br>
      Base64 length: <span>${b64Len.toLocaleString()} chars (~${(b64Len / 1024).toFixed(0)} KB)</span><br>
      Data URL prefix: <span>${prefix}...</span><br>
      Firestore limit (1MB doc): <span class="${b64Len < 900000 ? 'ok' : 'fail'}">${b64Len < 900000 ? '✓ OK — fits in Firestore' : '✗ TOO LARGE — will fail Firestore write'}</span>
    `;

    const img = document.getElementById('photo-img');
    document.getElementById('placeholder').style.display = 'none';
    img.style.display = 'block';

    img.onload = () => {
      info.innerHTML += `<br>Image rendered: <span class="ok">✓ Displayed successfully (${img.naturalWidth}×${img.naturalHeight}px)</span>`;
    };
    img.onerror = () => {
      info.innerHTML += `<br>Image rendered: <span class="fail">✗ FAILED to render — browser cannot display this format as a data URL</span>`;
    };

    img.src = dataUrl;
  };

  reader.onerror = () => {
    document.getElementById('info').innerHTML = `<span class="fail">✗ FileReader failed to read the file</span>`;
  };

  reader.readAsDataURL(file);
});
</script>
</body>
</html>
